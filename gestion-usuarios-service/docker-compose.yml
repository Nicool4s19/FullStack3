version: "3.8"

services:
  mysql-gestion-usuarios:
    image: mysql:8.0
    container_name: mysql-gestion-usuarios
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestion_usuarios_db
    ports:
      - "3307:3306"
    volumes:
      - gestion_usuarios_data:/var/lib/mysql

volumes:
  gestion_usuarios_data: