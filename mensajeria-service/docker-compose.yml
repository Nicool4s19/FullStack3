services:
  mysql-mensajeria:
    image: mysql:8.0
    container_name: mysql-mensajeria
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mensajeria_db
    ports:
      - "3308:3306"
    volumes:
      - mensajeria_data:/var/lib/mysql

volumes:
  mensajeria_data: