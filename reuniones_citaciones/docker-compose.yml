services:
  mysql-reuniones-citaciones:
    image: mysql:8.0

    container_name: mysql-reuniones-citaciones

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reuniones_citaciones_db

    ports:
      - "3308:3306"

    volumes:
      - reuniones_citaciones_data:/var/lib/mysql

volumes:
  reuniones_citaciones_data: